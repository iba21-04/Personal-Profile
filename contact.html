<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Ira Batra</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">✨</span>
                <span class="logo-text">Ira Batra</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="experience.html" class="nav-link">Experience</a></li>
                <li><a href="projects.html" class="nav-link">Projects</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <section id="contact" class="contact">
        <div class="section-header">
            <h2>Let's Connect!</h2>
            <div class="header-line"></div>
        </div>
        <div class="contact-container">
            <div class="contact-info">
                <h3>Get In Touch</h3>
                <p>I'm always interested in new projects, collaborations, and opportunities. Feel free to reach out!</p>
                <div class="contact-links-group">
                    <a href="mailto:irabatra21@gmail.com" class="contact-link">
                        <span class="link-icon">✉️</span>
                        <span>Email Me</span>
                    </a>
                    <a href="https://github.com/iba21-04" target="_blank" class="contact-link">
                        <span class="link-icon">💻</span>
                        <span>GitHub</span>
                    </a>
                    <a href="https://www.linkedin.com/in/ira-batra-20b512243/" target="_blank" class="contact-link">
                        <span class="link-icon">🔗</span>
                        <span>LinkedIn</span>
                    </a>
                </div>
            </div>

            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required>
                    <div class="input-glow"></div>
                </div>

                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" required>
                    <div class="input-glow"></div>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                    <div class="input-glow"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-submit">Send Message</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>Built with passion, designed with love, powered by code. ✨</p>
        </div>
    </footer>

    <!-- Scroll to Top Button -->
    <button class="scroll-to-top" onclick="scrollToTop()">↑</button>

    <script src="js/script.js"></script>
</body>
</html>
